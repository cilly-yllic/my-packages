name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  NODE_VERSION_FILE: .nvmrc
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_TOKEN }}

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: 'npm'

      # firebase-tools (Firestore emulator) requires JDK 21+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Takumi Guard: 既知の悪性 npm パッケージをプロキシ (npm.flatt.tech) でブロックする
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0

      - run: npm ci --legacy-peer-deps
      - run: npm i -g firebase-tools
      - run: npx nx build --project=plugins/builder
      - uses: nrwl/nx-set-shas@v4
      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World
      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected
      - run: npx nx affected -t lint test build

  # firebase-contract の dart generator 生成物（dart-check/lib/gen、vitest のファイルスナップショット）を
  # build_runner + dart analyze で検証する
  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/firebase-contract/dart-check
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.7
      - run: dart pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart analyze --fatal-infos
      - run: dart run bin/roundtrip.dart
