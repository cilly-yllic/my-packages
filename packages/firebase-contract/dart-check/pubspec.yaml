# firebase-contract の `dart` generator の生成物（lib/gen/**、vitest のファイルスナップショット）を
# build_runner + dart analyze で検証するためのパッケージ。公開しない。
name: fbc_dart_check
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  # Flutter SDK なしで解析できるよう、Timestamp だけを持つスタブに差し替える
  cloud_firestore:
    path: packages/cloud_firestore
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

dev_dependencies:
  build_runner: 2.17.1
  freezed: 4.0.3
  json_serializable: 6.15.2
  lints: 6.1.0
